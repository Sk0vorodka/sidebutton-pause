# Builds Side Button Pause (personal Geode mod) for Windows x64, GD 2.2091,
# on the free mac_mini_m2 runner by cross-compiling: LLVM clang-cl + lld-link,
# Windows SDK / MSVC CRT fetched via xwin (same recipe as win-mod-astra-2091).
workflows:
  build-mod:
    name: Side Button Pause (win, GD 2.2091)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.6
      vars:
        XWIN_SDK: "10.0.26100"
        XWIN_ARCH: "x86_64"
        BINDINGS_REF: "619c7de3cac2d14e57ca67ab7820057d079ddca6"
        GEO_VER_TARGET: "2.2091"
        GEO_COMP_TARGET: "22091"
        GEODE_V6_REF: "777c2b6"
    cache:
      cache_paths:
        - ~/.cpm-cache
        - ~/.xwin-cache
        - ~/.geode-v6
        - ~/.geode-bnd

    scripts:
      - name: Install build tools (xwin, ninja, cmake, llvm, lld)
        script: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          for f in xwin ninja cmake llvm lld; do
            if ! command -v "$f" >/dev/null 2>&1; then
              brew install "$f"
            fi
          done
          export PATH="$(brew --prefix lld)/bin:$(brew --prefix llvm)/bin:$PATH"
          echo "LLVM: $(clang-cl --version | head -1)"

      - name: Fetch Windows SDK + MSVC CRT via xwin (splat)
        script: |
          set -euo pipefail
          mkdir -p "$HOME/.xwin-cache"
          xwin --cache-dir "$HOME/.xwin-cache" --arch "$XWIN_ARCH" --sdk-version "$XWIN_SDK" \
            --accept-license splat --include-debug-libs

      - name: Clone geode v6 (pinned 777c2b6) + prebuilt Geode.lib + toolchain + bindings (pinned)
        script: |
          set -euo pipefail
          # geode v6: blobless clone (fast, cached), then hard-checkout the
          # pinned commit so the tree matches the prebuilt Geode.lib ABI
          # (newer codegen binaries emit includes newer trees lack).
          if [ ! -d "$HOME/geode-v6/.git" ]; then
            git clone --filter=blob:none -b v6 https://github.com/geode-sdk/geode "$HOME/geode-v6"
          fi
          git -C "$HOME/geode-v6" fetch --filter=blob:none origin v6 >/dev/null
          pin=$(git -C "$HOME/geode-v6" rev-parse "$GEODE_V6_REF")
          git -C "$HOME/geode-v6" checkout -q --detach "$pin"
          echo "geode v6 pinned at: $pin"
          rm -rf "$CM_BUILD_DIR/upstream-v6"
          git -C "$HOME/geode-v6" worktree prune
          git -C "$HOME/geode-v6" worktree add "$CM_BUILD_DIR/upstream-v6" HEAD
          # Prebuilt v6 loader import lib (same ABI as the installed loader).
          mkdir -p upstream-v6/bin/nightly
          curl -L --fail -o upstream-v6/bin/nightly/Geode.lib \
            "https://raw.githubusercontent.com/Sk0vorodka/geode/ci-gd-209/pilot-sdk-bin/Geode.lib"
          ls -la upstream-v6/bin/nightly/

          if [ ! -d "$HOME/geode-bnd/.git" ]; then
            git clone https://github.com/geode-sdk/bindings "$HOME/geode-bnd"
          fi
          ( git -C "$HOME/geode-bnd" fetch origin >/dev/null || true; )
          git -C "$HOME/geode-bnd" checkout -q --detach "$BINDINGS_REF"
          echo "bindings pinned at: $(git -C "$HOME/geode-bnd" rev-parse HEAD)"

          if [ ! -d "$HOME/clang-msvc-sdk/clang-cl-msvc.cmake" ]; then
            git clone --depth 1 https://github.com/geode-sdk/clang-msvc-sdk "$HOME/clang-msvc-sdk"
          fi

      - name: Install Geode CLI (v3.9.0, macOS)
        script: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -L --fail -o /tmp/geode-cli.zip \
            "https://github.com/geode-sdk/cli/releases/download/v3.9.0/geode-cli-v3.9.0-mac.zip"
          unzip -o /tmp/geode-cli.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/geode"
          "$HOME/bin/geode" --version || echo "geode CLI: (version unavailable)"

      - name: Configure + build Side Button Pause (Windows x64, GD 2.2091)
        script: |
          set -euo pipefail
          export PATH="$HOME/bin:$(brew --prefix lld)/bin:$(brew --prefix llvm)/bin:$PATH"
          export CPM_SOURCE_CACHE="$HOME/.cpm-cache"
          export GEODE_SDK="$CM_BUILD_DIR/upstream-v6"
          export GEODE_BINDINGS_REPO_PATH="$HOME/geode-bnd"
          mkdir -p "$CPM_SOURCE_CACHE"
          cd "$CM_BUILD_DIR"   # mod sources are at the repo root

          echo "== configure =="
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/clang-msvc-sdk/clang-cl-msvc.cmake" \
            -DSPLAT_DIR="$HOME/.xwin-cache/splat" \
            -DHOST_ARCH="$XWIN_ARCH" \
            -DGEODE_GD_VERSION="$GEO_VER_TARGET" \
            -DGEODE_COMP_GD_VERSION="$GEO_COMP_TARGET" \
            -DGEODE_BINDINGS_PATH="$HOME/geode-bnd/bindings/2.2091" \
            -DSKIP_BUILDING_CODEGEN=OFF \
            -DGEODE_UNITY_BUILD=ON \
            -DGEODE_TARGET_PLATFORM=Win64 \
            -DGEODE_DONT_INSTALL_MODS=ON \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DFMT_MODULE=OFF \
            -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja"

          echo "== build =="
          cmake --build build --config Release --parallel

          echo "== output .geode =="
          find "$CM_BUILD_DIR/build" -maxdepth 3 -name "*.geode" -exec ls -la {} \;

      - name: Publish .geode to GitHub Releases (skipped when GITHUB_TOKEN is absent)
        script: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN not set - skipping GitHub release publish"
            exit 0
          fi
          export GH_TOKEN="$GITHUB_TOKEN"
          gh release create "ci-$CM_BUILD_NUMBER" \
            --repo Sk0vorodka/sidebutton-pause \
            --target "$CM_COMMIT" \
            --title "build $CM_BUILD_NUMBER" \
            --notes "Automated Side Button Pause build $CM_BUILD_NUMBER ($CM_COMMIT)" \
            build/*.geode
          gh release view "ci-$CM_BUILD_NUMBER" --repo Sk0vorodka/sidebutton-pause --json assets,url

    artifacts:
      - build/*.geode
      - build/**/*.geode
